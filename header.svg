<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C989"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8f7440"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C9A96E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#C9A96E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#C9A96E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1000" height="340" rx="26" fill="#0b0b0d"/>
  <rect width="1000" height="340" rx="26" fill="url(#grid)"/>
  <rect width="1000" height="340" rx="26" fill="url(#glow)"/>
  <rect x="1" y="1" width="998" height="338" rx="25" fill="none" stroke="#C9A96E" stroke-opacity="0.22" stroke-width="1.5"/>

  <!-- Floating particles -->
  <g opacity="0.5">
    <circle cx="80" cy="70" r="3" fill="#C9A96E">
      <animate attributeName="cy" values="70;58;70" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="90" r="2.4" fill="#E8C989">
      <animate attributeName="cy" values="90;76;90" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="270" r="2" fill="#C9A96E">
      <animate attributeName="cy" values="270;258;270" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.12;0.5" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="250" r="2.8" fill="#C9A96E">
      <animate attributeName="cy" values="250;236;250" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.1;0.55" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="52" r="1.8" fill="#E8C989">
      <animate attributeName="cy" values="52;42;52" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Terminal window (top-right) -->
  <g transform="translate(640, 30)">
    <rect width="290" height="96" rx="10" fill="#0e0e10" stroke="#2a2a2e" stroke-width="1"/>
    <circle cx="18" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="5" fill="#febc2e"/>
    <circle cx="58" cy="18" r="5" fill="#28c840"/>
    <text x="112" y="23" font-family="Courier New, monospace" font-size="10" fill="#7A776E" text-anchor="middle" letter-spacing="2">~/moaz-nassef</text>
    <text x="16" y="48" font-family="Courier New, monospace" font-size="11.5" fill="#C9A96E">$ whoami</text>
    <text x="16" y="68" font-family="Courier New, monospace" font-size="11.5" fill="#EDE9E1">→ Flutter Developer 🇪🇬</text>
    <text x="16" y="86" font-family="Courier New, monospace" font-size="11.5" fill="#EDE9E1">→ Building quality apps
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      <tspan fill="#C9A96E">▌</tspan>
    </text>
  </g>

  <!-- Code comment line (top-left) -->
  <g font-family="Courier New, monospace" font-size="12" fill="#7A776E">
    <text x="60" y="52">
      <tspan fill="#C9A96E">//</tspan> software engineer · cairo, egypt
      <animate attributeName="opacity" values="0.25;1;0.25" dur="3.4s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Main title -->
  <text x="60" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="bold" fill="url(#goldGrad)" letter-spacing="2">
    MOAZ
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="60" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="52" fill="#EDE9E1" letter-spacing="6">
    NASSEF
    <animate attributeName="opacity" values="0;1" dur="1.2s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Animated gold underline -->
  <rect x="60" y="242" width="430" height="3" rx="1.5" fill="url(#lineGrad)">
    <animate attributeName="width" values="0;430" dur="1.6s" begin="0.8s" fill="freeze"/>
  </rect>

  <!-- Subtitle + blinking cursor -->
  <text x="60" y="278" font-family="Courier New, monospace" font-size="19" fill="#C9A96E" letter-spacing="1">
    <tspan fill="#EDE9E1">Software Engineer</tspan> <tspan fill="#C9A96E">·</tspan> Flutter &amp; Dart <tspan fill="#C9A96E">·</tspan> Clean Architecture
  </text>
  <text x="716" y="278" font-family="Courier New, monospace" font-size="19" fill="#C9A96E">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    ▮
  </text>

  <!-- Small status pills -->
  <g font-family="Courier New, monospace" font-size="11" fill="#EDE9E1">
    <g>
      <rect x="60" y="300" width="118" height="24" rx="12" fill="#C9A96E" fill-opacity="0.12" stroke="#C9A96E" stroke-opacity="0.4"/>
      <circle cx="78" cy="312" r="3.5" fill="#4ade80">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="92" y="316">Open to work</text>
    </g>
    <g>
      <rect x="192" y="300" width="132" height="24" rx="12" fill="#C9A96E" fill-opacity="0.12" stroke="#C9A96E" stroke-opacity="0.4"/>
      <text x="210" y="316">📱 20+ projects</text>
    </g>
    <g>
      <rect x="338" y="300" width="120" height="24" rx="12" fill="#C9A96E" fill-opacity="0.12" stroke="#C9A96E" stroke-opacity="0.4"/>
      <text x="356" y="316">🇪🇬 Cairo</text>
    </g>
  </g>

  <!-- Bottom fade -->
  <rect x="0" y="0" width="1000" height="340" fill="none" stroke="#C9A96E" stroke-opacity="0.12"/>
</svg>
